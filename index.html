    <script>

      function updateTitle() {
        const path = window.location.pathname;
        let title = "Home - Titocci Metalcostruzioni SAGL";
        let description = "Ihr Assistent für die Titocci Metalconstruzioni SAGL";

        if (path.includes('/chi-siamo')) {
          title = "Il Fabbro: creazioni personalizzate";
        }


        // 1. Titel aktualisieren
        document.title = title;



        // 3. Open Graph Description aktualisieren

      }

      // Event-Listener für Navigation & initiales Laden
      window.addEventListener('popstate', updateTitle());
      document.addEventListener('DOMContentLoaded', updateTitle);

      // MutationObserver für React SPA-Routenwechsel
      const observer = new MutationObserver(updateTitle);
      document.addEventListener('DOMContentLoaded', () => {
        const root = document.getElementById('root');
        if (root) {
          observer.observe(root, { childList: true, subtree: true });
        }
      });




        if (path.includes('/chi-siamo')) {
          title = "Fabbro: Creazioni Uniche in Metalconstruzioni SAGL";

         }


    </script>




  </head>

  <body>
    <div id="root"></div>

  </body>
