<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Basis-Titel & Meta Description für Suchmaschinen -->
  <title>Titocci Metalcostruzioni SAGL – Metallbau &amp; Schmiedearbeiten im Tessin</title>
  <meta name="description" id="meta-description" content="Ihr Experte für hochwertige Metallbau-, Schlosserei- und Schmiedearbeiten nach Maß – Titocci Metalcostruzioni SAGL." />
  <meta name="keywords" content="Metallbau, Schmied, Schlosserei, Metallkonstruktionen, Tessin, Titocci, Geländer, Treppen, Metallbauarbeiten" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://titoccimetal.ch/" />

  <!-- Favicons & Touch Icons -->
  <link rel="icon" type="image/png" href="/src/assets/Navicon.png" />
  <link rel="apple-touch-icon" href="/src/assets/Navicon.png" />

  <!-- Open Graph / Facebook / WhatsApp (Social Media SEO) -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="de_CH" />
  <meta property="og:site_name" content="Titocci Metalcostruzioni SAGL" />
  <meta property="og:title" id="og-title" content="Titocci Metalcostruzioni SAGL – Metallbau &amp; Schmiedearbeiten" />
  <meta property="og:description" id="og-description" content="Ihr Experte für hochwertige Metallbau-, Schlosserei- und Schmiedearbeiten nach Maß." />
  <meta property="og:image" content="/src/assets/Navicon.png" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="twitter-title" content="Titocci Metalcostruzioni SAGL" />
  <meta name="twitter:description" id="twitter-description" content="Ihr Experte für hochwertige Metallbau- und Schmiedearbeiten." />

  <!-- Strukturtierte Daten (JSON-LD für Google Rich Results) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Titocci Metalcostruzioni SAGL",
      "description": "Exklusive Metallbau- und Schmiedearbeiten nach Maß.",
      "url": "https://titoccimetal.ch/",
      "logo": "https://titoccimetal.ch/src/assets/Navicon.png",
      "priceRange": "$$"
    }
  </script>

  <!-- Dynamisches SEO-Skript für SPA-Routing -->
  <script>
    function updateMetaData() {
      const path = window.location.pathname.toLowerCase();

      let title = "Titocci Metalcostruzioni SAGL – Metallbau & Schmiedearbeiten";
      let description = "Ihr Experte für hochwertige Metallbau- und Schmiedearbeiten nach Maß – Titocci Metalcostruzioni SAGL.";

      if (path.includes('/home') || path === '/') {
        title = "Startseite | Titocci Metalcostruzioni SAGL – Metallbau & Schmiedekunst";
        description = "Willkommen bei Titocci Metalcostruzioni. Wir fertigen einzigartige Metallbau-Kreationen, Geländer und Treppen nach Maß.";
      } else if (path.includes('/chi-siamo') || path.includes('/aboutus')) {
        title = "Über uns | Titocci Metalcostruzioni SAGL";
        description = "Entdecken Sie unser Handwerksunternehmen und unsere Erfahrung in Metallbau, Schlosserei und individuellem Schmiedehandwerk.";
      } else if (path.includes('/galeria')) {
        title = "Galerie & Referenzen | Titocci Metalcostruzioni SAGL";
        description = "Lassen Sie sich von unseren maßgeschneiderten Metallbau-Projekten, Schmiedearbeiten und Geländern inspirieren.";
      } else if (path.includes('/kontakte')) {
        title = "Kontakt & Beratung | Titocci Metalcostruzioni SAGL";
        description = "Nehmen Sie Kontakt mit uns auf. Wir beraten Sie gerne individuell zu Ihren Bau- und Metallbauprojekten.";
      } else if (path.includes('/calculatori')) {
        title = "Baukosten-Rechner | Titocci Metalcostruzioni SAGL";
        description = "Nutzen Sie unseren Online-Rechner für eine erste Schätzung Ihrer Metallbau- und Konstruktionsprojekte.";
      } else if (path.includes('/sitemap')) {
        title = "Sitemap | Titocci Metalcostruzioni SAGL";
        description = "Übersicht aller Seiten und Bereiche von Titocci Metalcostruzioni SAGL.";
      } else if (path.includes('/impressum')) {
        title = "Impressum | Titocci Metalcostruzioni SAGL";
        description = "Rechtliche Informationen und Impressum von Titocci Metalcostruzioni SAGL.";
      } else if (path.includes('/privacy')) {
        title = "Datenschutz | Titocci Metalcostruzioni SAGL";
        description = "Informationen zum Datenschutz und der Verarbeitung personenbezogener Daten bei Titocci Metalcostruzioni SAGL.";
      }

      // Title & Meta Description im DOM setzen
      document.title = title;

      let metaDesc = document.querySelector('meta[name="description"]');
      if (!metaDesc) {
        metaDesc = document.createElement('meta');
        metaDesc.name = 'description';
        document.head.appendChild(metaDesc);
      }
      metaDesc.setAttribute('content', description);

      // Social Media Open Graph & Twitter Tags synchronisieren
      const ogTitle = document.getElementById('og-title');
      const ogDesc = document.getElementById('og-description');
      const twTitle = document.getElementById('twitter-title');
      const twDesc = document.getElementById('twitter-description');

      if (ogTitle) ogTitle.setAttribute('content', title);
      if (ogDesc) ogDesc.setAttribute('content', description);
      if (twTitle) twTitle.setAttribute('content', title);
      if (twDesc) twDesc.setAttribute('content', description);
    }

    // Event-Listener für Client-Side Routing
    window.addEventListener('popstate', updateMetaData);
    document.addEventListener('DOMContentLoaded', updateMetaData);

    const observer = new MutationObserver(updateMetaData);
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('root');
      if (root) {
        observer.observe(root, { childList: true, subtree: true });
      }
    });
  </script>
</head>

<body>
<!-- Barrierefreiheit: Tastatur-Navigation direkt zum Hauptinhalt -->
<a href="#main-content" style="position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden;" onfocus="this.style.position='static'; this.style.width='auto'; this.style.height='auto';">
  Zum Hauptinhalt springen
</a>

<!-- Haupt-Container für React App -->
<div id="root" role="main"></div>

<script type="module" src="/src/main.jsx"></script>
</body>
</html>
