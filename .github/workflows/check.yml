name: CI/CD Pipeline & Dependency Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Code-Qualität & Dependency Security Checks
  # -------------------------------------------------------------
  lint-and-check:
    name: Linting & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Node project files
        id: node_project
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
              echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
            echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 20
        if: steps.node_project.outputs.has_package_json == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        if: steps.node_project.outputs.has_package_json == 'true'
        run: |
          if [ "${{ steps.node_project.outputs.has_lockfile }}" = "true" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint
        if: steps.node_project.outputs.has_package_json == 'true'
        run: npm run lint --if-present

      # Integrierter Dependency & Vulnerability Check
      - name: Run Dependency Audit
        if: steps.node_project.outputs.has_package_json == 'true'
        run: npm audit --audit-level=high
        continue-on-error: true # Setze auf 'false', falls die Pipeline bei Sicherheitslücken abbrechen soll

      - name: Skip Node checks when no project files exist
        if: steps.node_project.outputs.has_package_json != 'true'
        run: echo "No package.json file found in the repository root. Skipping Node dependency and lint checks."

  # -------------------------------------------------------------
  # JOB 2: Docker Build & Push (läuft nach erfolgreichem Job 1)
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    needs: lint-and-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/titocci-metalcostruzioni-sagl-website
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
