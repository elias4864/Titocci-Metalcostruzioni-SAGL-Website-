name: Deploy Website for GitHub Pages on Titocci-Metalcostruzioni-SAGL-Website

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Node app directory
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
            echo "app_dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PACKAGE_JSON_PATH=$(find . -path '*/node_modules/*' -prune -o -name package.json -print -quit)

          if [ -n "$PACKAGE_JSON_PATH" ]; then
            APP_DIR=$(dirname "$PACKAGE_JSON_PATH")
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
            echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
            echo "app_dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deployment if no Node app exists
        if: steps.detect.outputs.has_package_json != 'true'
        run: echo "No package.json found in this repository. Skipping Node install and GitHub Pages deployment."

      - name: Setup Node.js
        if: steps.detect.outputs.has_package_json == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.detect.outputs.app_dir }}/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.has_package_json == 'true'
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build project
        if: steps.detect.outputs.has_package_json == 'true'
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: npm run build

      - name: Configure GitHub Pages
        if: steps.detect.outputs.has_package_json == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.detect.outputs.has_package_json == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.app_dir }}/dist

      - name: Deploy to GitHub Pages
        if: steps.detect.outputs.has_package_json == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
