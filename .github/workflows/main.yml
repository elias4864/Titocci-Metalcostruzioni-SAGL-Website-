name: Deploy Website for GitHub Pages on Titocci-Metalcostruzioni-SAGL-Website

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    # WICHTIG: Hier geben wir den Unterordner an, in dem dein React-Projekt liegt!
    # (Falls der Ordner anders heißt, passe "my-react-app" entsprechend an)
    defaults:
      run:
        working-directory: ./my-react-app/Titocci-Metalcostruzioni-SAGL-Website-

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install --legacy-peer-deps

      - name: Projekt bauen (Build)
        run: npm run build

      - name: Build-Artefakt(Docker Image) hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          # Da wir im Unterordner sind, muss der Pfad zum dist-Ordner angepasst werden:
          path: './my-react-app/dist'

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
