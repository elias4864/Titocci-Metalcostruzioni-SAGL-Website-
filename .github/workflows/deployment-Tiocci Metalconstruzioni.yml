name: Docker CI React Frontend (Node) Build

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Verzeichnisinhalt anzeigen
        run: ls -la

      - name: Dockerfile prüfen
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Dockerfile found in repository root."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile found in repository root. Skipping Docker build."
          fi

      - name: Docker Setup Buildx
        if: ${{ steps.dockerfile.outputs.exists == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Docker Image bauen
        if: ${{ steps.dockerfile.outputs.exists == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: titocci-website:latest
