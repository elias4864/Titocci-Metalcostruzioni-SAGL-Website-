name: Docker CI React Frontend (Node) Build

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      # 1. Verzeichnisinhalt anzeigen
      - name: Verzeichnisinhalt anzeigen
        run: ls -la

      # 2. Docker Buildx einrichten
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker-Image bauen (Pfad auf ./src/Dockerfile angepasst)
      - name: Docker Image bauen
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: titocci-website:latest
