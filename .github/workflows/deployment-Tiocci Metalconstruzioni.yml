name: Docker CI  React Frontend(Node) Build

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auf den Server laden
      - name: Code auschecken
        uses: actions/checkout@v4

      # Directory prüfen
      - name: Verzeichnisinhalt anzeigen
       uses: ls -la 

      # 2. Docker Buildx einrichten (für modernes Bauen)
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker-Image bauen (Testet, ob Dockerfile & React-Build fehlerfrei durchlaufen)
      - name: Docker Image bauen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Steht auf false, da wir hier nur testen wollen. (Kann später für Docker Hub auf true gesetzt werden)
          tags: titocci-website:latest
