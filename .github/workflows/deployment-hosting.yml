
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      artifact_path: ${{ steps.detect.outputs.artifact_path }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Application
        id: detect
        shell: bash
        run: |
          package_json_path=$(find . \
            -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -path './.github' -prune -o \
            -name package.json -print -quit)

          if [ -n "$package_json_path" ]; then
            app_dir=$(dirname "$package_json_path")

            echo "has_app=true" >> "$GITHUB_OUTPUT"
            echo "app_dir=$app_dir" >> "$GITHUB_OUTPUT"
            echo "artifact_path=$app_dir/dist" >> "$GITHUB_OUTPUT"

            echo "Node.js application found: $app_dir"

          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"

            if [ -f "index.html" ]; then
              echo "static_dir=." >> "$GITHUB_OUTPUT"
            elif [ -f "docs/index.html" ]; then
              echo "static_dir=docs" >> "$GITHUB_OUTPUT"
            else
              echo "ERROR: No index.html found!"
              exit 1
            fi

            echo "artifact_path=_site" >> "$GITHUB_OUTPUT"
            echo "Static website detected."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        if: steps.detect.outputs.has_app == 'true'
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Application
        if: steps.detect.outputs.has_app == 'true'
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: npm run build -- --base="/${{ github.event.repository.name }}/"

      - name: Verify Build
        if: steps.detect.outputs.has_app == 'true'
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: test -f dist/index.html

      - name: Prepare Static Website
        if: steps.detect.outputs.has_app != 'true'
        shell: bash
        run: |
          mkdir -p _site

          if [ "${{ steps.detect.outputs.static_dir }}" = "." ]; then
            rsync -av \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='_site' \
              ./ _site/
          else
            cp -a docs/. _site/
          fi

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.artifact_path }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
