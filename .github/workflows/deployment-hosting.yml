name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "dev"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.detect_app.outputs.has_app }}
      app_dir: ${{ steps.detect_app.outputs.app_dir }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Find Node app
        id: detect_app
        shell: bash
        run: |
          package_json_path=$(find . -path '*/node_modules/*' -prune -o -path '*/.git/*' -prune -o -name package.json -print -quit)
          if [ -z "$package_json_path" ]; then
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "app_dir=." >> "$GITHUB_OUTPUT"
            echo "No package.json found; Pages build and deployment will be skipped."
            exit 0
          fi

          app_dir=$(dirname "$package_json_path")
          echo "has_app=true" >> "$GITHUB_OUTPUT"
          echo "app_dir=$app_dir" >> "$GITHUB_OUTPUT"
          echo "Found Node app in: $app_dir"

      - name: Set up Node.js
        if: steps.detect_app.outputs.has_app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.detect_app.outputs.has_app == 'true'
        working-directory: ${{ steps.detect_app.outputs.app_dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build project
        if: steps.detect_app.outputs.has_app == 'true'
        working-directory: ${{ steps.detect_app.outputs.app_dir }}
        run: npm run build -- --base="/${{ github.event.repository.name }}/"

      - name: Verify build output
        if: steps.detect_app.outputs.has_app == 'true'
        working-directory: ${{ steps.detect_app.outputs.app_dir }}
        run: test -f dist/index.html

      - name: Setup Pages
        if: steps.detect_app.outputs.has_app == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.detect_app.outputs.has_app == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect_app.outputs.app_dir }}/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.has_app == 'true'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
