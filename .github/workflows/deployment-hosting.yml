
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Find Node app
        id: detect_app
        shell: bash
        run: |
          package_json_path=$(find . -path '*/node_modules/*' -prune -o -path '*/.git/*' -prune -o -name package.json -print -quit)

          if [ -z "$package_json_path" ]; then
            echo "Keine package.json gefunden!"
            exit 1
          fi

          app_dir=$(dirname "$package_json_path")
          echo "app_dir=$app_dir" >> "$GITHUB_OUTPUT"
          echo "App gefunden: $app_dir"

      - name: Install dependencies
        working-directory: ${{ steps.detect_app.outputs.app_dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build project
        working-directory: ${{ steps.detect_app.outputs.app_dir }}
        run: npm run build -- --base="/${{ github.event.repository.name }}/"

      - name: Verify build output
        working-directory: ${{ steps.detect_app.outputs.app_dir }}
        run: test -f dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect_app.outputs.app_dir }}/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
